# ==============================================================================
# CloudMeet Production Stack (Connected to your EXISTING Traefik instance)
# Domain: admin.cloudnewsmeet.com | Server: 69.62.75.165
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. CloudMeet Backend API Engine (Node.js + Express + TRTC UserSig)
  # ----------------------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cloudmeet-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cloudmeet}:${POSTGRES_PASSWORD:-cloudmeet_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-cloudmeet_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      TRTC_SDK_APP_ID: ${TRTC_SDK_APP_ID:?Set TRTC_SDK_APP_ID in .env}
      TRTC_SECRET_KEY: ${TRTC_SECRET_KEY:?Set TRTC_SECRET_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cloudmeet.cn}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
    depends_on:
      postgres:
        condition: service_healthy
    # `&&` so the API does not boot when the database schema step fails.
    # Do not run `docker compose down -v`: that deletes the postgres volume.
    command: sh -c "npx prisma db push --skip-generate && node dist/index.js"
    networks:
      - internal-net
      - traefik-net
    labels:
      - "traefik.enable=true"
      # Expose through your existing Traefik instance
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"
      # Route all /api and /health requests to Backend API (Priority 20)
      - "traefik.http.routers.cloudmeet-api.rule=Host(`${DOMAIN:-admin.cloudnewsmeet.com}`) && (PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/join`))"
      - "traefik.http.routers.cloudmeet-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.cloudmeet-api.tls=true"
      - "traefik.http.routers.cloudmeet-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.cloudmeet-api.priority=20"
      - "traefik.http.routers.cloudmeet-api.service=cloudmeet-api"
      - "traefik.http.services.cloudmeet-api.loadbalancer.server.port=5000"

  # ----------------------------------------------------------------------------
  # 2. CloudMeet Web Admin Panel (React 19 + Vite + Nginx Alpine)
  # ----------------------------------------------------------------------------
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_TRTC_SDK_APP_ID: ${TRTC_SDK_APP_ID:?Set TRTC_SDK_APP_ID in .env}
        VITE_APP_TITLE: "CloudMeet 云会 - 管理后台"
    container_name: cloudmeet-admin
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - internal-net
      - traefik-net
    labels:
      - "traefik.enable=true"
      # Expose through your existing Traefik instance
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"
      # Route all frontend web traffic to Admin Nginx (Priority 10)
      - "traefik.http.routers.cloudmeet-web.rule=Host(`${DOMAIN:-admin.cloudnewsmeet.com}`)"
      - "traefik.http.routers.cloudmeet-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.cloudmeet-web.tls=true"
      - "traefik.http.routers.cloudmeet-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.cloudmeet-web.priority=10"
      - "traefik.http.routers.cloudmeet-web.service=cloudmeet-web"
      - "traefik.http.services.cloudmeet-web.loadbalancer.server.port=80"

  # ----------------------------------------------------------------------------
  # 3. PostgreSQL Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cloudmeet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudmeet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudmeet_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-cloudmeet_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudmeet} -d ${POSTGRES_DB:-cloudmeet_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # Private network for internal communication between backend and database
  internal-net:
    name: cloudmeet-internal-net
    driver: bridge
  # External network connected to your EXISTING Traefik container
  traefik-net:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}

volumes:
  postgres-data:
    name: cloudmeet-postgres-data
